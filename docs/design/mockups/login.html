<!-- Subtle enterprise architectural grid and ambient glow -->

<div class="absolute w-[680px] h-[680px] bg-primary/10 rounded-full blur-3xl -top-24 -left-20"></div>
<div class="absolute w-[500px] h-[500px] bg-tertiary-container/10 rounded-full blur-2xl -bottom-20 -right-20"></div>
<svg class="w-full h-full opacity-35" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="32" id="infra-grid" patternUnits="userSpaceOnUse" width="32">
<path class="text-outline-variant" d="M 32 0 L 0 0 0 32" fill="none" stroke="currentColor" stroke-width="0.5"></path>
<circle class="text-primary" cx="0" cy="0" fill="currentColor" r="1"></circle>
</pattern>
</defs>
<rect fill="url(#infra-grid)" height="100%" width="100%"></rect>

</div>
<!-- Operational Telemetry Micro-Pill Header -->

<!-- Main Login Card Canvas -->
<div class="relative z-10 w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-xl p-space-xl md:p-space-2xl">
<!-- Top Branding & Hardware Node Header -->
<div class="flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-xl bg-surface-container-low flex items-center justify-center p-2 mb-space-md shadow-sm">
<img alt="AssetCore ITAM Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VehIpLlujVgWHrrxeq7zHQhvyTI22UpKFXSvmAGpz5YCiyDVvPV4uvGuOLn1IlK2Rny3vl0a8-oYejTR2OeR_KjjNbPjGY50tcSbDmsT7xeC5YQU1hxwUw4GxBalUx3O40jYdc_hr8YKdmqsm_4UJ5hBjEeX9YSEy0A0EuVB2Solkwo98UPoNJiO7wMhHcS_vMaYR7Lq0w3uEz1HCPRa-8eV6zfgmktSvHygxfBGQXdw">
</div>
<div class="flex items-center gap-space-xs">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Compañia</h1>

</div>
<p class="font-body-md text-body-md text-on-surface-variant font-medium mt-0.5">
        Sistema de Gestión de Inventarios y Activos Tecnológicos
      </p>
<div class="mt-space-sm w-full bg-surface-container-low py-1.5 px-space-sm rounded">
<p class="font-label-ui-strong text-label-ui-strong text-secondary uppercase tracking-wider">
          Portal de Autenticación de Administradores y Especialistas de TI
        </p>
</div>
</div>
<!-- Enterprise SSO Direct Login Trigger -->
<div class="mt-space-xl">

</div>
<!-- Structured Divider -->
<div class="relative flex items-center my-space-lg">
<div class="flex-grow h-px bg-surface-container-high"></div>
<span class="flex-shrink mx-space-sm font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-wider bg-surface-container-lowest px-2">
        O credenciales locales
      </span>
<div class="flex-grow h-px bg-surface-container-high"></div>
</div>
<!-- Credentials Authentication Form -->
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Email Field Container -->
<div class="flex flex-col gap-1 text-left">
<label class="font-label-ui-strong text-label-ui-strong text-on-surface uppercase flex items-center justify-between" for="corporateEmail">
<span class="">Correo Electrónico Corporativo</span>
<span class="text-outline font-label-mono-sm lowercase font-normal">login</span>
</label>
<div class="relative flex items-center rounded bg-surface-container-low shadow-inner">
<span class="material-symbols-outlined text-outline absolute left-3 pointer-events-none select-none text-[20px]">
            account_circle
          </span>
<input class="w-full pl-10 pr-3 py-2 bg-transparent text-on-surface font-body-md text-body-md rounded placeholder:text-outline/70 focus:outline-none focus:bg-surface-container-lowest transition-colors" id="corporateEmail" placeholder="usuario@empresa.com" required="" type="email">
</div>
</div>
<!-- Password Field Container -->
<div class="flex flex-col gap-1 text-left">
<div class="flex items-center justify-between">
<label class="font-label-ui-strong text-label-ui-strong text-on-surface uppercase" for="corporatePassword">
            Contraseña
          </label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container font-medium transition-colors" href="#recuperar">
            ¿Olvidaste tu contraseña?
          </a>
</div>
<div class="relative flex items-center rounded bg-surface-container-low shadow-inner">
<span class="material-symbols-outlined text-outline absolute left-3 pointer-events-none select-none text-[20px]">
            lock
          </span>
<input class="w-full pl-10 pr-10 py-2 bg-transparent text-on-surface font-body-md text-body-md rounded placeholder:text-outline/70 focus:outline-none focus:bg-surface-container-lowest transition-colors" id="corporatePassword" placeholder="••••••••••••" required="" type="password">
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-2.5 p-1 text-outline hover:text-on-surface flex items-center justify-center transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Session Checkbox -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<div class="relative flex items-center">
<input class="peer sr-only" id="rememberDevice" type="checkbox">
<div class="w-4 h-4 bg-surface-container-high peer-checked:bg-primary rounded flex items-center justify-center transition-colors shadow-sm">
<span class="material-symbols-outlined text-[13px] text-on-primary opacity-0 peer-checked:opacity-100 font-bold transition-opacity">
                check
              </span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant font-medium">Recordar este terminal (12 hrs)</span>
</label>
<div class="flex items-center gap-1 font-label-mono-sm text-label-mono-sm text-outline">
<span class="material-symbols-outlined text-[14px]">shield</span>
<span class="">MFA Requerido</span>
</div>
</div>
<!-- Submit Primary Action Button -->
<button class="mt-space-sm w-full bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-headline-sm py-2.5 px-space-md rounded shadow-md hover:shadow-lg flex items-center justify-center gap-space-sm transition-all active:scale-[0.99]" id="submitBtn" type="submit">
<span id="btnText" class="">Iniciar Sesión</span>
<span class="material-symbols-outlined text-[18px]" id="btnIcon">arrow_forward</span>
</button>
</form>
<!-- System Protocol Audit Notice -->

</div>
<!-- Operational Footer Controls & Diagnostics -->

</div>
<script>
  (function () {
    const passwordInput = document.getElementById('corporatePassword');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const ssoButton = document.getElementById('ssoButton');

    // Toggle Password Visibility Logic
    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Interactive Authentication Mock
    window.triggerAuth = function () {
      if (!submitBtn) return;
      submitBtn.disabled = true;
      btnText.textContent = 'Autenticando en Directorio...';
      btnIcon.textContent = 'sync';
      btnIcon.classList.add('animate-spin');

      setTimeout(function () {
        btnText.textContent = 'Token Verificado. Redirigiendo...';
        btnIcon.textContent = 'check_circle';
        btnIcon.classList.remove('animate-spin');
        submitBtn.classList.remove('bg-primary');
        submitBtn.classList.add('bg-tertiary');
      }, 1200);
    };

    if (ssoButton) {
      ssoButton.addEventListener('click', function () {
        ssoButton.disabled = true;
        ssoButton.classList.add('opacity-75');
        const originalText = ssoButton.querySelector('span');
        if (originalText) {
          originalText.textContent = 'Conectando con Microsoft Entra ID...';
        }
      });
    }
  })();
</script></main>
