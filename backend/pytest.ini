[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
pythonpath = .
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers -p no:cacheprovider -m "not system"
markers =
    unit: Pruebas unitarias aisladas que no requieren base de datos ni servicios externos.
    integration: Pruebas de integración que requieren base de datos PostgreSQL.
    system: Pruebas de sistema extremo a extremo con servicios levantados.


