[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # Line length is handled by ruff format
    "RUF012",  # Mutable class attributes (standard in Django models/views/admin)
    "B008",    # Function call in argument defaults (DRF inline serializers, etc.)
]

[tool.ruff.lint.per-file-ignores]
"config/settings/dev.py" = ["F403", "F405"]
"config/settings/prod.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
combine-as-imports = true
